# Command-line Alembic configuration. The database URL comes from DATABASE_URL.
#   uv run alembic -c alembic.ini upgrade head
#   uv run alembic -c alembic.ini current
#   uv run alembic -c alembic.ini revision --autogenerate -m "describe change"

[alembic]
script_location = src/insurance_submission_extractor/persistence/migrations
prepend_sys_path = src
