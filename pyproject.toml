[project]
name = "insurance-submission-extractor"
version = "0.1.0"
description = "A provider-agnostic LLM service for extracting structured commercial insurance submissions."
readme = "README.md"
authors = [
    { name = "Kristian", email = "kristian.klaban@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
insurance-submission-extractor = "insurance_submission_extractor.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]