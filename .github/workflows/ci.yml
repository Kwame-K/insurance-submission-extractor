name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Synchronize dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Run MCP server tests
        run: uv run pytest tests/test_mcp_server.py -v

      - name: Smoke test MCP server import
        run: >
          uv run python -c
          "from insurance_submission_extractor.mcp_server.server import mcp, main;
          print('MCP server import OK')"

      - name: Build Docker image
        run: docker build --tag insurance-submission-extractor:ci .
  postgres-migrations:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: extractor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql://postgres:ci@localhost:5432/extractor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Synchronize dependencies
        run: uv sync --locked --all-groups

      - name: Apply migrations with the Alembic CLI
        run: uv run alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}

      - name: Run PostgreSQL persistence tests
        run: uv run pytest tests/test_persistence_postgres.py -v -rs
